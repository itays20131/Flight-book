<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Flights – Perth Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  ✈️ Perth Flight Hub
  <span class="sub">Main Hub</span>
</header>

<main>
  <div class="card">
    <h2>Book a Flight</h2>

    <label>Roblox Username</label>
    <input id="roblox" placeholder="Enter username">

    <label>Discord Username</label>
    <input id="discord" placeholder="name#0000">

    <label>Destination</label>
    <select id="destination">
      <option value="">Select destination</option>
      <option>Cyprus</option>
      <option>Greater Rockford</option>
      <option>Saint Barthélemy</option>
      <option>Skopelos</option>
      <option>Izolirani</option>
      <option>Orengi</option>
      <option>Grindavik</option>
    </select>

    <label>Trip Type</label>
    <select id="trip">
      <option value="One Way">One Way</option>
      <option value="Round Trip">Round Trip</option>
    </select>

    <button onclick="sendBooking()">Book Flight</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
