<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Perth Flight Hub – PTFS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  ✈️ Perth Flight Hub
  <div class="sub">Main Hub – PTFS Booking System</div>
</header>

<main>
  <div class="card">
    <h2>Book a Flight</h2>

    <label>Roblox Username</label>
    <input id="roblox" placeholder="Your Roblox username">

    <label>Discord Username</label>
    <input id="discord" placeholder="username#0000">

    <label>Choose Destination</label>

    <div class="map">
      <!-- ✏️ כאן אתה מוסיף / מוחק טיסות -->
      <button onclick="setDestination('Cyprus')">Cyprus</button>
      <button onclick="setDestination('Greater Rockford')">Greater Rockford</button>
      <button onclick="setDestination('Saint Barthélemy')">Saint Barthélemy</button>
      <button onclick="setDestination('Skopelos')">Skopelos</button>
      <button onclick="setDestination('Izolirani')">Izolirani</button>
      <button onclick="setDestination('Orengi')">Orengi</button>
      <button onclick="setDestination('Grindavik')">Grindavik</button>
    </div>

    <p class="selected">
      Selected destination:
      <span id="dest">None</span>
    </p>

    <label>Trip Type</label>
    <select id="trip">
      <option value="One Way">One Way</option>
      <option value="Round Trip">Round Trip</option>
    </select>

    <button onclick="sendBooking()">Book Flight</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
