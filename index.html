<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Air Canada – Book Flights</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  ✈️ Air Canada – Book Flights
  <p>Select your flight</p>
</header>

<div class="card">
  <form id="bookingForm">

    <label>Roblox Username</label>
    <input type="text" id="username" required placeholder="Enter your Roblox name">

    <label>Select Flight</label>
    <select id="flight" required>
      <option value="">-- Choose a flight --</option>
      <option>AC101 – Toronto (CYYZ) → Vancouver (CYVR)</option>
      <option>AC202 – Montreal (CYUL) → New York (KJFK)</option>
    </select>

    <button type="submit">Book Flight</button>

  </form>

  <p id="status"></p>
</div>

<script src="script.js"></script>
</body>
</html>


<script src="script.js"></script>
</body>
</html>
