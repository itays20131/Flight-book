<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perth Flight Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  ✈ Perth Flight Hub
  <div class="sub">PTFS Booking System</div>

  <select id="langSelect" onchange="setLang(this.value)">
    <option value="en">English</option>
    <option value="he">עברית</option>
    <option value="ru">Русский</option>
  </select>
</header>

<main>
<div class="card">

<h2 id="title">Book Flight</h2>

<label id="l1">Roblox Username</label>
<input id="roblox">

<label id="l2">Discord Username</label>
<input id="discord">

<label id="l3">Select Destination</label>

<div class="map-container">
  <img src="map.png" class="map-img">

  <div class="dot cyprus" onclick="setDestination('Cyprus')"></div>
  <div class="dot rockford" onclick="setDestination('Rockford')"></div>
  <div class="dot barth" onclick="setDestination('Saint Barthélemy')"></div>
</div>

<p class="selected">
<span id="selectedText">Selected:</span>
<span id="dest">None</span>
</p>

<label id="l4">Aircraft</label>
<select id="aircraft">
  <option>A320</option>
  <option>B737</option>
  <option>B787</option>
</select>

<label id="l5">Flight Time</label>
<input type="time" id="time">

<label id="l6">Trip Type</label>
<select id="trip">
  <option>One Way</option>
  <option>Round Trip</option>
</select>

<button onclick="sendBooking()" id="bookBtn">Book Flight</button>

</div>
</main>

<script src="script.js"></script>
</body>
</html>
